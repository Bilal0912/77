name: Enable GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-pages.yml'

permissions:
  contents: write
  pages: write
  actions: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try enabling Pages with repository token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages-response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/pages \
            -d '{"build_type":"workflow"}')
          echo "$code" > .pages-enable-status
          if [ "$code" = "201" ] || [ "$code" = "204" ] || [ "$code" = "409" ]; then
            echo "enabled-or-existing" >> .pages-enable-status
          else
            python - <<'PY'
import json
try:
    d=json.load(open('/tmp/pages-response.json'))
    print(d.get('message','unknown'))
except Exception:
    print('unknown')
PY
          fi >> .pages-enable-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages-enable-status
          git commit -m "Record Pages enablement result" || exit 0
          git push
